name: Emulator smoke

# Run by hand, not on every push. This has never gone green on a hosted runner —
# it dies about a minute in, long before the suite starts, which points at AVD
# creation rather than anything in this repo. As a push job it painted a red
# check on every commit, which trains everyone to ignore the checks that matter.
#
# Run it from the Actions tab when you want to work on it:
#   Actions → Emulator smoke → Run workflow
on:
  workflow_dispatch:

jobs:
  emulator:
    name: emulator smoke
    runs-on: ubuntu-latest
    # KVM is what makes a headless emulator usable rather than glacial.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: uv sync --extra dev
      - name: Run the live suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb devices -l
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abi
            ANDROID_DRIVER_LIVE=1 uv run pytest tests/integration -v --tb=short -rA
