name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  emulator:
    name: emulator smoke
    runs-on: ubuntu-latest
    # Advisory, not a gate. This job has never gone green on a hosted runner, and
    # until someone works out why, letting it fail the build would mean the badge
    # reports the emulator's mood rather than whether the code is broken. The logs
    # are still here for whoever picks it up.
    continue-on-error: true
    # KVM is what makes a headless emulator usable rather than glacial.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: uv sync --extra dev
      - name: Run the live suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb devices -l
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abi
            ANDROID_DRIVER_LIVE=1 uv run pytest tests/integration -v --tb=short -rA
