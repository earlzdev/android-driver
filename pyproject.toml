[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "android-driver"
version = "0.1.0"
description = "MCP server that turns an Android emulator into a deterministic, agent-drivable test harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "earlzdev" }]
keywords = ["mcp", "android", "emulator", "adb", "uiautomator", "testing", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.2,<2",
    "PyYAML>=6.0",
    "uiautomator2>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/earlzdev/android-driver"
Repository = "https://github.com/earlzdev/android-driver"
Issues = "https://github.com/earlzdev/android-driver/issues"
Documentation = "https://github.com/earlzdev/android-driver#readme"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
android-driver = "android_driver.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/android_driver"]

# An allowlist, not an exclude list. Hatchling reads only the root .gitignore, so
# a nested one (test_app/.gitignore, which hides local.properties and its
# absolute SDK path) and anything in the user's global git ignore both sail
# straight into the sdist. Naming what ships is the only way to be sure; a
# release cannot be unpublished.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "examples", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real emulator; skipped unless ANDROID_DRIVER_LIVE=1",
    "slow: takes tens of seconds (snapshots, recordings)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
